<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="img/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XESSIA - Gestión Odontológica</title>
  </head>
  <body>
    <div id="root">
      <!-- High-fidelity premium loading placeholder while JS mounts -->
      <div style="
        position: fixed;
        inset: 0;
        background: #F8FAFC;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 99999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      ">
        <img src="img/Logo.png" alt="XESSIA" style="
          width: 80px;
          height: 80px;
          object-fit: contain;
          filter: drop-shadow(0 4px 10px rgba(0, 163, 255, 0.15));
        " />
        <div style="
          width: 44px;
          height: 44px;
          border: 3px solid rgba(0, 0, 0, 0.05);
          border-top-color: #00A3FF;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>
        <div style="
          font-size: 12px;
          font-weight: 700;
          color: #8A9CAE;
          letter-spacing: 2px;
          text-transform: uppercase;
        ">Conectando a XESSIA Cloud...</div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
